name: Update from Hyprland wiki

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --version

      - name: Update wiki submodule
        run: git submodule update --remote --recursive hyprland-wiki

      - name: Copy wiki sources
        run: |
          set -euo pipefail
          if compgen -G "hyprland-wiki/pages/Configuring/*.md" >/dev/null; then
            cp hyprland-wiki/pages/Configuring/*.md parser/data/sources/
          else
            cp hyprland-wiki/content/Configuring/*.md parser/data/sources/
          fi

      - name: Regenerate library/hl.config.meta.lua
        run: |
          go run ./cmd/gen-lua library/hl.config.meta.lua
          stylua examples library/hl.config.meta.lua

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: refresh wiki + regenerate hl.config.meta.lua'
          title: 'chore: update from Hyprland wiki'
          body: Automated update of `hyprland-wiki` and regeneration of the typed config schema.
          branch: bot/update-from-wiki
